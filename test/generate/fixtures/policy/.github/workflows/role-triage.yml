# GENERATED by acme/policy from roles/triage/role.yaml. Do not edit here; change the role.
# One run of the triage: lunareng/airlock-actions' role workflow reads roles/triage/role.yaml at the run's commit (its
# repositories, model, turns, tools and minutes) and gets the run's token, MCP sessions and telemetry from Airlock.
# Its timer is acme's clock (generated/schedules.json: "15 9 * * 1-5"), which dispatches with
# clock=true; those runs are off until the repository variable AGENTS_ENABLED is "true". A dispatch without clock
# (the router, a person) runs once. `reason` is why it was started (the clock's schedule or routine, the router's
# rule), which Airlock records as the run's own account.
name: role triage
on:
  workflow_dispatch:
    inputs:
      signal:
        description: "a signal URL to lead with (optional)"
        type: string
        default: ""
      clock:
        description: "set by the clock: a scheduled run, subject to AGENTS_ENABLED"
        type: boolean
        default: false
      provider:
        description: "claude or codex; blank uses the fleet setting, then role policy"
        type: string
        default: ""
      auth:
        description: "subscription or api-key; blank uses the fleet setting, then subscription"
        type: string
        default: ""
      reason:
        description: "why it was started, for the run's record (the clock and router set it)"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write   # a GitHub OIDC token for Airlock: proof of this run, no repo access
concurrency:
  group: role-triage
  cancel-in-progress: false
jobs:
  run:
    if: ${{ !inputs.clock || vars.AGENTS_ENABLED == 'true' }}
    uses: lunareng/airlock-actions/.github/workflows/role.yml@0123456789abcdef0123456789abcdef01234567 # main at acme's pin
    with:
      role: triage
      provider: ${{ inputs.provider }}
      auth: ${{ inputs.auth }}
      signal: ${{ inputs.signal }}
      reason: ${{ inputs.reason }}
      clock: ${{ inputs.clock }}
      runner: acme-agents
      git-email-domain: acme.example
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
