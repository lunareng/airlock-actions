schema: 1
repo: acme/lunar-salon
owner_role: sim-engineer
default: L4
actions:
  send: L2
  spend: L2
  delete_data: L1
  touch_ehi: L1
  change_policy: L2
judge:
  metric: invariant_pass_rate_7d
  source: "sim:parlor-sim incident report"
  pass: ">= 0.99"
  check: {repo: acme/lunar-salon, issue_label: sim-coverage, max_age_days: 7}   # the reporter's daily comment
goals: GOALS.md
digest: monthly
budget:
  prs_in_flight: 2
  prs_per_week: 5
  spend_usd: 100

# Permanent floors from the charter (cannot be loosened here):
#   Capcom send/consent/suppression L2 · Academy publish/email L2 · Parlor payments/deposits/SMS L2
#   LunarMD EHI L1 · secrets/DNS/backups/cluster auth L1 · deleting customer data L1
