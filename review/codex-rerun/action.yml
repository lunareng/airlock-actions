name: refresh Codex review result
description: Rerun the existing current-head review check after a trusted app result changes; metadata only, no model or PR
  code.
runs:
  using: composite
  steps:
  - name: gh (when the runner image ships none; pinned checksum)
    shell: bash
    env:
      GH_VERSION: 2.101.0
      GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
    run: 'set -euo pipefail

      command -v gh >/dev/null && exit 0

      dir="$RUNNER_TEMP/gh-${GH_VERSION}"; mkdir -p "$dir"

      curl -sSfL -o "$dir/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"

      echo "${GH_SHA256}  $dir/gh.tar.gz" | sha256sum -c -

      tar xzf "$dir/gh.tar.gz" -C "$dir" --strip-components=2 "gh_${GH_VERSION}_linux_amd64/bin/gh"

      echo "$dir" >> "$GITHUB_PATH"

      '
  - name: refresh the current review row
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PROVIDER: ${{ vars.AIRLOCK_REVIEW_PROVIDER || vars.AIRLOCK_AGENT_PROVIDER || 'claude' }}
      HERE: ${{ github.action_path }}/..
    run: python3 -I "$HERE/codex-rerun.py"
