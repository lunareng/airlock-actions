name: claude review, the push-time row
description: >
  Makes a PR's two claude-review rows, one per event, say the same thing, since GitHub holds both against the required
  check (lunareng/autonomy#140, lunareng/airlock-actions#40). Run it as its own job, with permissions actions: write and
  pull-requests: read, after the review job (needs: review), only when that job passed or failed. It is a separate job so that
  actions: write never reaches the job that runs a model over the PR. It must not be named claude-review.
inputs:
  passed:
    description: whether the review job passed (true or false, from needs.review.result)
    required: true
runs:
  using: composite
  steps:
    - name: gh (when the runner image ships none; pinned checksum, as the review action installs it)
      shell: bash
      env:
        GH_VERSION: 2.101.0
        GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
      run: |
        set -euo pipefail
        command -v gh >/dev/null && exit 0
        dir="$RUNNER_TEMP/gh-${GH_VERSION}"; mkdir -p "$dir"
        curl -sSfL -o "$dir/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
        echo "${GH_SHA256}  $dir/gh.tar.gz" | sha256sum -c -
        tar xzf "$dir/gh.tar.gz" -C "$dir" --strip-components=2 "gh_${GH_VERSION}_linux_amd64/bin/gh"
        echo "$dir" >> "$GITHUB_PATH"
    - name: make the other row agree
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        EVENT: ${{ github.event_name }}
        PR: ${{ github.event.pull_request.number }}
        PASSED: ${{ inputs.passed }}
        GATE: ${{ github.action_path }}/../../gate
      run: |
        # A re-run joins the push's concurrency group, so re-running an old head's job could cancel the new head's review.
        now="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)" || { echo "::warning::could not read the PR's head; re-run the push-time check by hand"; exit 0; }
        if [ "$now" != "$HEAD" ]; then echo "::notice::the PR has moved past $HEAD; nothing to re-run"; exit 0; fi
        python3 -I "$GATE/rerun.py" --job claude-review --passed "$PASSED" --wait-seconds 60 || echo "::warning::could not re-run the other claude-review row; re-run it by hand"
