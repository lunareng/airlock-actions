# The selected provider reviews every pull request against the autonomy charter: lunareng/airlock-actions' review actions, run as
# the steps of this repo's own jobs, so the checks are named claude-review (required on main; the verdict binds
# agents' PRs, <airlock:agent_logins>, and anyone else's gets it as a warning) and claude-security-review (advisory).
name: claude review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review: # a person's approval re-runs only the verdict step (an agent's workflow PR waits for one)
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read # the review waits for the push-time run; never write here, this job runs a model over the PR
# Each event kind cancels only its own kind; a new push still cancels the review of the head it replaces.
concurrency:
  group: claude-review-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  review:
    name: claude-review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: <airlock:runner><airlock:runner_note>
    timeout-minutes: 20
    steps:
      - uses: lunareng/airlock-actions/review@<airlock:review_ref><airlock:review_ref_note>
        with:
          provider: ${{ vars.AIRLOCK_REVIEW_PROVIDER || vars.AIRLOCK_AGENT_PROVIDER || 'claude' }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          agent-logins: "<airlock:agent_logins>"
          human-owner: <airlock:human_owner_name>
  security:
    name: claude-security-review
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: <airlock:runner>
    timeout-minutes: 20
    steps:
      - uses: lunareng/airlock-actions/review/security@<airlock:review_ref><airlock:review_ref_note>
        with:
          provider: ${{ vars.AIRLOCK_REVIEW_PROVIDER || vars.AIRLOCK_AGENT_PROVIDER || 'claude' }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  # The two claude-review rows, one per event, say the same thing. Its own job, so actions: write never reaches the job
  # above. It must not be named claude-review.
  rows:
    name: claude-review-rows
    needs: review
    if: ${{ always() && (needs.review.result == 'success' || needs.review.result == 'failure') }}
    runs-on: <airlock:runner><airlock:runner_note>
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - uses: lunareng/airlock-actions/review/rerun@<airlock:review_ref><airlock:review_ref_note>
        with:
          passed: ${{ needs.review.result == 'success' }}
