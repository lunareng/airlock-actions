# adopt/'s tests: rollout, new-repo, protect and render against the invented acme policy repo, with a stand-in gh
# whose GitHub is a directory of bare repositories (test/adopt/fake_gh.py). Nothing here reaches GitHub.
name: test adopt
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-adopt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest # a public repository: GitHub-hosted runners, free, and the self-hosted pools take no public repositories
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: the adopt tools
        run: |
          pip install --quiet pyyaml==6.0.3
          python test/adopt/test_adopt.py
