# The ratchet's tests (ratchet/ratchet.py), on the invented acme policy repo under test/ratchet/fixtures. No network,
# no token: GitHub is a stand-in, and the clocks read a git repository the test makes from the fixture.
name: test-ratchet
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-ratchet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ratchet:
    runs-on: ubuntu-latest # a public repository: GitHub-hosted runners
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet pyyaml==6.0.3
          python -I test/ratchet/test_ratchet.py
