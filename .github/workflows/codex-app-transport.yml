# Temporary integration proof for this PR. No production review verdict and no checkout of the PR head.
name: Codex app transport proof
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: codex-app-transport-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  transport:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/app-review-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 946e1c54ff1dfa7d34070fc91af769a614652201 # fixed bridge/probe source; never PR code
          persist-credentials: false
      - name: workflow-token requests receive current-head code and security reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I review/transport-smoke.py
