# The action's suite (test/): its main and post steps run as the runner runs them, against a stand-in Airlock and a
# stand-in GitHub OIDC endpoint. On every pull request and every main commit; a release is a main commit (AUTONOMY.yaml:
# action_suite_green).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: lunareng-ci # the org's self-hosted pool, which bills no Actions minutes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - run: npm test
