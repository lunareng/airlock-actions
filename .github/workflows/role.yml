# One run of an agent role, called from the role's own workflow in a tenant's policy repo
# (.github/workflows/role-<role>.yml), so that file holds only its triggers and this call (lunareng/airlock#41).
# Everything the run does comes from roles/<role>/role.yaml at the run's commit: its token, MCP sessions and
# telemetry from Airlock (Mint grants nothing wider than the file), the repositories it clones, its model, turns,
# tools and minutes. Airlock accepts a run of this workflow only from the role's own file on the default branch,
# and only at a release of this repository or a pinned commit (workflow_unreleased otherwise).
#
#   jobs:
#     run:
#       uses: lunareng/airlock-actions/.github/workflows/role.yml@v1
#       with:
#         role: triage
#         signal: ${{ inputs.signal }}
#         reason: ${{ inputs.reason }}
#         clock: ${{ inputs.clock }}
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# The caller's job needs permissions contents: read and id-token: write. `reason` and `clock` say why the run was
# started (the clock's `schedule <cron>` or `routine:<name>`, the router's rule and target); Airlock records them on
# the run as the run's own account, never as proof, and never refuses a run over them.
name: role
on:
  workflow_call:
    inputs:
      role:
        description: the role's name, as in roles/<role>/role.yaml
        type: string
        required: true
      signal:
        description: a signal URL for the run to lead with (optional)
        type: string
        default: ""
      reason:
        description: why the run was started, as its dispatcher says, for the run's record at Airlock (optional)
        type: string
        default: ""
      clock:
        description: true when the clock started the run (a scheduled run)
        type: boolean
        default: false
      runner:
        description: the runner label the run's jobs use
        type: string
        default: ubuntu-latest
      airlock-url:
        description: Airlock's origin
        type: string
        default: https://airlock.lunareng.com
      git-email-domain:
        description: the domain of the commit email, <role>@<domain>
        type: string
        default: users.noreply.github.com
      provider:
        description: "Agent CLI: claude or codex; empty uses the fleet setting, then role policy."
        type: string
        default: ""
      auth:
        description: "Authentication: subscription or api-key; empty uses AIRLOCK_AGENT_AUTH, then subscription."
        type: string
        default: ""
      runner-auth-url:
        description: "Codex subscription broker; empty uses AIRLOCK_RUNNER_AUTH_URL."
        type: string
        default: ""
      codex-version:
        description: the pinned Codex CLI release
        type: string
        default: "0.167.0"
      claude-code-version:
        description: the Claude Code release the run installs
        type: string
        default: "2.1.304"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: required only for Claude subscription authentication
        required: false
      ANTHROPIC_API_KEY:
        description: required only for Claude API-key authentication
        required: false
      OPENAI_API_KEY:
        description: required only for Codex API-key authentication
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  # The role's minutes, which a job's timeout can't read until a job before it has read the file.
  plan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    outputs:
      minutes: ${{ steps.plan.outputs.minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: plan
        env:
          ROLE: ${{ inputs.role }}
        run: |
          python3 -I - <<'PY'
          import os, re, sys
          role = os.environ["ROLE"]
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,62}", role):
              print(f"::error title=role::{role!r} is not a role name"); sys.exit(1)
          text = open(f"roles/{role}/role.yaml").read()
          # Only the one number this job needs, read without a YAML library: budget.minutes_per_run.
          m = re.search(r"^budget:\s*\n(?:[ \t]+.*\n)*?[ \t]+minutes_per_run:\s*(\d{1,3})\s*$", text, re.M)
          minutes = (int(m.group(1)) if m else 45) + 15
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"minutes={minutes}\n")
          print(f"{role}: {minutes} minutes")
          PY

  run:
    needs: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.minutes) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: the role's file
        id: plan
        uses: lunareng/airlock-actions/agent/plan@553c56aa4e1c55968f357c9f085a680079b28e9a # routine signals by their file; retained source/agent-routine-553c56a
        with:
          role: ${{ inputs.role }}
          signal: ${{ inputs.signal }}
          provider: ${{ inputs.provider || vars.AIRLOCK_AGENT_PROVIDER }}
          auth: ${{ inputs.auth || vars.AIRLOCK_AGENT_AUTH }}
          claude-model: ${{ vars.AIRLOCK_CLAUDE_MODEL }}
          codex-model: ${{ vars.AIRLOCK_CODEX_MODEL }}
      - name: airlock (this run's GitHub token, MCP sessions and telemetry)
        id: app
        timeout-minutes: 2
        # Main at 93f23a8: #31 (sends reason and clock to Mint), the read-only token cleanup, and #52 (mint and revoke
        # tried again when API Gateway, not Airlock, answered; at most 110 s, inside this step's 2 minutes). It isn't a
        # release: re-pin to the v1.x tag that contains 93f23a8 once one is cut.
        uses: lunareng/airlock-actions@93f23a84bc9d46cb3d4280083f18f7096a258cfc # mint/revoke retry on API Gateway 5xx, #52
        with:
          role: ${{ inputs.role }}
          signal: ${{ inputs.signal }}
          reason: ${{ inputs.reason }}
          clock: ${{ inputs.clock }}
          airlock-url: ${{ inputs.airlock-url }}
      - name: no token, no run
        if: steps.app.outputs.token == ''
        env:
          ROLE: ${{ inputs.role }}
        run: |
          echo "::error::Airlock handed $ROLE no token (in shadow there at this commit?); the run stops here"
          exit 1
      - name: the MCP sessions, for Claude Code's env
        env:
          SESSIONS: ${{ steps.app.outputs.sessions }}
          CONNECTORS: ${{ steps.plan.outputs.connectors }}
        run: |
          python -I - <<'PY'
          # Each run.mcp server's session, as the variable mcp.json names; the action has masked every one.
          import json, os, re, sys
          sessions = json.loads(os.environ.get("SESSIONS") or "{}")
          env = open(os.environ["GITHUB_ENV"], "a")
          for c in json.loads(os.environ["CONNECTORS"]):
              token = (sessions.get(c) or {}).get("token") or ""
              if not re.fullmatch(r"[A-Za-z0-9._~+/=-]{20,8192}", token):
                  print(f"::error::Airlock handed no MCP session for {c}; the run stops here"); sys.exit(1)
              env.write("ROLE_MCP_" + re.sub(r"[^A-Z0-9]", "_", c.upper()) + f"_TOKEN={token}\n")
          PY
      - name: tools (gh)
        run: |
          command -v gh >/dev/null || {
            curl -fsSL https://github.com/cli/cli/releases/download/v2.89.0/gh_2.89.0_linux_amd64.tar.gz | tar xz -C /tmp
            sudo install /tmp/gh_2.89.0_linux_amd64/bin/gh /usr/local/bin/gh
          }
      - name: clone the role's repositories
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ steps.app.outputs.read-token }}
          ROLE: ${{ inputs.role }}
          DOMAIN: ${{ inputs.git-email-domain }}
        run: |
          git config --global user.name "$ROLE"
          git config --global user.email "$ROLE@$DOMAIN"
          gh auth setup-git   # git uses GH_TOKEN through gh's credential helper; no token in any .git/config
          mkdir -p repos
          # A repository the role writes to clones on its token; any other (its context) on the read-only token.
          python -I -c 'import json,os; [print(c["repo"], "write" if c["write"] else "read") for c in json.load(open(os.environ["RUNNER_TEMP"] + "/clones.json"))]' |
            while read -r repo how; do
              if [ "$how" = write ]; then tok="$GH_TOKEN"; else tok="$READ_TOKEN"; fi
              GH_TOKEN="$tok" git clone --depth 50 --quiet "https://github.com/$repo.git" "repos/${repo#*/}"
            done
      - name: run the brief
        uses: lunareng/airlock-actions/agent@01d8df232ec19af32302886c04763aa57bc6cf3f # launcher source in this PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          plan-path: ${{ runner.temp }}/plan.json
          provider: ${{ steps.plan.outputs.provider }}
          cli-version: ${{ steps.plan.outputs.provider == 'codex' && inputs.codex-version || inputs.claude-code-version }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          runner-auth-url: ${{ inputs.runner-auth-url || vars.AIRLOCK_RUNNER_AUTH_URL }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: ${{ inputs.role }}-run
          path: |
            run.json
            run.jsonl
            result.txt
