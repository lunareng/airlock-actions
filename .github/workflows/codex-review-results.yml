# App result updates/deletions must refresh the required row, even when the PR commit did not change.
# issue_comment uses the default-branch workflow. This job executes only a pinned metadata reader.
name: refresh Codex review
on:
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: write # isolated from the review/model jobs; this handler can rerun, never grant a verdict
jobs:
  refresh:
    if: ${{ github.event.issue.pull_request && github.event.comment.user.id == 199175422 && (vars.AIRLOCK_REVIEW_PROVIDER || vars.AIRLOCK_AGENT_PROVIDER || 'claude') == 'codex' }}
    # Only an eligible app event joins the cancellation group. Ordinary comments cannot cancel it.
    concurrency:
      group: codex-review-result-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest # public repo: hosted, no self-hosted credentials
    timeout-minutes: 25
    steps:
      - uses: lunareng/airlock-actions/review/codex-rerun@920c2ac19df380b0a82ace49ee3dc16561d64e4c # app-bridge source, PR #58
