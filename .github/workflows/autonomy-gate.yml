# Copy to .github/workflows/autonomy-gate.yml in a lunareng repo. The gate follows lunareng/autonomy's
# main on purpose (2026-10-21): main is already the policy every level and floor comes from, only Matthew
# merges there (enforce_admins, the validate check), and a SHA pin only meant a round of bump PRs on every
# gate change. The org's Actions policy pins every `uses:` to a commit, lunareng's own included, so the
# gate is not referenced as an action: the job checks lunareng/autonomy out at main and runs it as a
# path-local action, which the policy allows. The token for that checkout comes from Airlock (POST /v1/read,
# lunareng/airlock#45): Contents read on the policy repo alone, for this repository's own gate workflow, proven
# by the job's GitHub OIDC token. The one App the org installs is Airlock's; there is no reader App or secret.
name: autonomy gate
on:
  pull_request:   # edited and auto_merge_*: an L1 PR's Proof owed and auto-merge are part of its verdict (autonomy#146)
    types: [opened, synchronize, reopened, edited, auto_merge_enabled, auto_merge_disabled]
  pull_request_review:   # the owner's approval on an agent's L1/L2 PR passes the gate (gate/action.yml)
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: write
  id-token: write   # the OIDC token Airlock reads the policy for
jobs:
  gate:
    name: autonomy-gate
    runs-on: lunareng-ci # the org's self-hosted pool (lunareng/k8s infrastructure/arc), which bills no Actions minutes (2026-10-22)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: airlock (a read of the policy repo; no token, no gate)
        id: reader
        env:
          AIRLOCK: https://airlock.lunareng.com
        run: |
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AIRLOCK" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          answer="$(curl -sS -X POST -H "Authorization: Bearer $oidc" "$AIRLOCK/v1/read")"
          token="$(printf '%s' "$answer" | python3 -c 'import json,re,sys; t=json.load(sys.stdin).get("token") or ""; print(t if re.fullmatch(r"[A-Za-z0-9_.~+/=-]{20,4096}", t) else "")')"
          if [ -z "$token" ]; then
            printf '%s' "$answer" | python3 -c 'import json,sys; a=json.load(sys.stdin); print("Airlock refused the policy read: %s (%s)" % (a.get("reason"), a.get("message")))' || echo "Airlock: no answer"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: lunareng/autonomy
          ref: main
          token: ${{ steps.reader.outputs.token }}
          path: .autonomy
      - uses: ./.autonomy/gate
      - name: airlock (end the policy read)
        if: always() && steps.reader.outputs.token != ''
        continue-on-error: true
        env:
          TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          curl -sS -o /dev/null -w 'policy read ended: %{http_code}\n' -X DELETE -H "Authorization: Bearer $TOKEN" https://api.github.com/installation/token
