# The digest's tests (digest/digest.py), on the invented acme policy repo under test/digest/fixtures. No network,
# no token: GitHub is a stand-in.
name: test-digest
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-digest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  digest:
    runs-on: ubuntu-latest # a public repository: GitHub-hosted runners
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet pyyaml==6.0.3
          python -I test/digest/test_digest.py
